apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsewatch-api
  namespace: pulsewatch
  labels:
    app: pulsewatch-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pulsewatch-api
  template:
    metadata:
      labels:
        app: pulsewatch-api
    spec:
      containers:
        - name: api
          image: pulsewatch/api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: pulsewatch-config
            - secretRef:
                name: pulsewatch-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pulsewatch-api-service
  namespace: pulsewatch
spec:
  selector:
    app: pulsewatch-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
