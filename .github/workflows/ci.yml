name: PulseWatch CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Run Tests
        run: go test -v -race ./...

  docker-build:
    name: Build Docker Images
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile.api
          push: false
          tags: pulsewatch/api:latest

      - name: Build Scheduler Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile.scheduler
          push: false
          tags: pulsewatch/scheduler:latest

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile.worker
          push: false
          tags: pulsewatch/worker:latest

  helm-lint:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Helm Lint
        run: helm lint deployments/helm/pulsewatch
